name: CI/CD Pipeline

on:
  push:
    branches: [ main, chore/* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./svg-grafik-next

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: svg-grafik-next/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Check Types
      run: npm run type-check

    - name: Run Lint
      run: npm run lint

    - name: Build Application
      run: npm run build
